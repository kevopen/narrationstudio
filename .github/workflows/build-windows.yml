name: build-windows
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt 6.8.2
        # qtsvg ships as an archive (not a module) in 6.8 — manual aqt call.
        # Mirror flakes happen (corrupt 7z); retry from scratch up to 3x.
        run: |
          pip install -q aqtinstall
          $ok = $false
          for ($i = 1; $i -le 3 -and !$ok; $i++) {
            try {
              if (Test-Path C:\Qt) { Remove-Item -Recurse -Force C:\Qt }
              aqt install-qt windows desktop 6.8.2 win64_msvc2022_64 -O C:\Qt --archives qtbase qtsvg --modules qtmultimedia qtimageformats qtpdf
              if ($LASTEXITCODE -eq 0) { $ok = $true } else { throw "exit $LASTEXITCODE" }
            } catch {
              Write-Host "Qt install attempt $i failed, retrying..."
              Start-Sleep -Seconds 20
            }
          }
          if (!$ok) { throw "Qt install failed after 3 attempts" }
          echo "CMAKE_PREFIX_PATH=C:/Qt/6.8.2/msvc2022_64" >> $GITHUB_ENV
      - name: Install CMake + Ninja
        run: choco install cmake ninja -y
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --test-dir build/release --output-on-failure
      - name: Package (zip)
        run: |
          cd build/release
          cpack -G ZIP
      - uses: actions/upload-artifact@v4
        with:
          name: NarrationStudio-windows
          path: build/release/*.zip
