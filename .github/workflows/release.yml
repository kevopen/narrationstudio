name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt 6.8.2
        # qtsvg ships as an archive (not a module) in 6.8 — manual aqt call.
        run: |
          pip install -q aqtinstall
          aqt install-qt windows desktop 6.8.2 win64_msvc2022_64 -O C:\Qt --archives qtbase qtsvg --modules qtmultimedia qtimageformats qtpdf
          echo "CMAKE_PREFIX_PATH=C:/Qt/6.8.2/msvc2022_64" >> $GITHUB_ENV
      - name: Install CMake + Ninja + NSIS
        run: choco install cmake ninja nsis -y
      - name: Fetch runtime files
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-all.ps1
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --test-dir build/release --output-on-failure
      - name: Package (ZIP + NSIS)
        run: |
          cd build/release
          cpack -G "ZIP;NSIS"
      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/*.zip
            build/release/NarrationStudio-*-win64.exe
          fail_on_unmatched_files: true
